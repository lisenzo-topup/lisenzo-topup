<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LISENZO TOP UP - Order</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f6fa;
    color: #172033;
}

header {
    background: white;
    padding: 18px 6%;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

.logo {
    color: #f39a00;
    font-size: 23px;
    font-weight: bold;
}

.container {
    width: 92%;
    max-width: 550px;
    margin: 30px auto;
}

.order-box {
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 4px 18px rgba(0,0,0,.08);
}

h1 {
    text-align: center;
    margin-bottom: 20px;
}

.product-info {
    background: #fff7e8;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 20px;
    text-align: center;
}

.product-name {
    font-size: 20px;
    font-weight: bold;
}

.product-price {
    color: #f39a00;
    font-size: 22px;
    font-weight: bold;
    margin-top: 7px;
}

label {
    display: block;
    font-weight: bold;
    margin-top: 15px;
    margin-bottom: 7px;
}

input,
select {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
}

.submit-btn {
    width: 100%;
    margin-top: 22px;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: #f39a00;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

#message {
    text-align: center;
    margin-top: 15px;
    font-weight: bold;
}

.success {
    color: #16a34a;
}

.error {
    color: #dc2626;
}
</style>
</head>

<body>

<header>
    <div class="logo">LISENZO TOP UP</div>
</header>

<div class="container">

<div class="order-box">

<h1>⚽ Place Order</h1>

<div class="product-info">
    <div class="product-name" id="productName">
        Loading...
    </div>

    <div class="product-price" id="productPrice">
        ৳ --
    </div>
</div>

<form id="orderForm">

<label>আপনার নাম</label>

<input
    type="text"
    id="customerName"
    placeholder="আপনার নাম"
    required
>

<label>মোবাইল / যোগাযোগ</label>

<input
    type="text"
    id="customerContact"
    placeholder="যোগাযোগের নম্বর"
    required
>

<label>eFootball Player ID</label>

<input
    type="text"
    id="playerId"
    placeholder="Player ID"
    required
>

<label>Payment Method</label>

<select id="paymentMethod" required>
    <option value="">Select Payment Method</option>
    <option value="bKash">bKash</option>
    <option value="Nagad">Nagad</option>
    <option value="Other">Other</option>
</select>

<label>Transaction ID</label>

<input
    type="text"
    id="transactionId"
    placeholder="Transaction ID"
    required
>

<button type="submit" class="submit-btn">
    PLACE ORDER
</button>

<div id="message"></div>

</form>

</div>
</div>

<script>

const SUPABASE_URL =
"https://spwhqftndqntkgqjczil.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_ZJYOQTotkhcF7Zlaeypx4w_L2gNHaya";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);

const params =
new URLSearchParams(window.location.search);

const productId =
params.get("product");

let selectedProduct = null;


async function loadProduct() {

    if (!productId) {
        document.getElementById("productName")
            .textContent = "Product not selected";
        return;
    }

    const { data, error } =
        await supabaseClient
        .from("products")
        .select("id,name,price")
        .eq("id", productId)
        .eq("Status", true)
        .maybeSingle();

    if (error || !data) {
        document.getElementById("productName")
            .textContent = "Product পাওয়া যায়নি";
        return;
    }

    selectedProduct = data;

    document.getElementById("productName")
        .textContent = data.name;

    document.getElementById("productPrice")
        .textContent = "৳ " + data.price;
}


document
.getElementById("orderForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();

    const message =
        document.getElementById("message");

    if (!selectedProduct) {
        message.className = "error";
        message.textContent = "Product পাওয়া যায়নি।";
        return;
    }

    const customerName =
        document.getElementById("customerName")
        .value.trim();

    const customerContact =
        document.getElementById("customerContact")
        .value.trim();

    const playerId =
        document.getElementById("playerId")
        .value.trim();

    const paymentMethod =
        document.getElementById("paymentMethod")
        .value;

    const transactionId =
        document.getElementById("transactionId")
        .value.trim();

    message.className = "";
    message.textContent = "Order submit হচ্ছে...";

    const { error } =
        await supabaseClient
        .from("orders")
        .insert({
            product_id: selectedProduct.id,
            customer_name: customerName,
            customer_contact: customerContact,
            player_id: playerId,
            payment_method: paymentMethod,
            transaction_id: transactionId
        });

    if (error) {
        console.error(error);

        message.className = "error";
        message.textContent =
            "Order submit হয়নি: " + error.message;

        return;
    }

    message.className = "success";
    message.textContent =
        "✅ Order সফলভাবে জমা হয়েছে!";

    document.getElementById("orderForm").reset();
});


loadProduct();

</script>

</body>
</html>
