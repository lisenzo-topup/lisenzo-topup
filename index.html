<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>LISENZO TOP UP - eFootball Coins</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f6fa;
    color: #172033;
}

header {
    background: white;
    padding: 18px 6%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 2px 12px rgba(0,0,0,.08);
}

.logo {
    color: #f39a00;
    font-size: 24px;
    font-weight: bold;
}

.admin-btn {
    background: #f39a00;
    color: white;
    padding: 10px 16px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
}

.notice {
    width: 92%;
    max-width: 1100px;
    margin: 18px auto;
    padding: 15px;
    background: #f39a00;
    color: white;
    border-radius: 9px;
    text-align: center;
    font-weight: bold;
}

.hero {
    width: 92%;
    max-width: 1100px;
    margin: 20px auto;
    background: #111827;
    color: white;
    border-radius: 15px;
    padding: 55px 20px;
    text-align: center;
}

.hero h1 {
    font-size: 35px;
    margin-bottom: 12px;
}

.hero p {
    color: #ddd;
    font-size: 17px;
}

.section-title {
    text-align: center;
    margin: 35px 0 20px;
    font-size: 28px;
}

.products {
    width: 92%;
    max-width: 1100px;
    margin: auto;
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
}

.product {
    background: white;
    padding: 22px;
    border-radius: 14px;
    text-align: center;
    box-shadow: 0 4px 15px rgba(0,0,0,.08);
}

.coin {
    font-size: 55px;
    margin-bottom: 10px;
}

.product h3 {
    margin-bottom: 8px;
}

.description {
    color: #777;
    font-size: 14px;
    min-height: 35px;
}

.price {
    color: #f39a00;
    font-size: 22px;
    font-weight: bold;
    margin: 14px 0;
}

.buy-btn {
    display: inline-block;
    background: #f39a00;
    color: white;
    padding: 11px 25px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
}

#loading {
    text-align: center;
    margin: 30px;
}

#error {
    text-align: center;
    color: #dc2626;
    margin: 30px;
}

footer {
    margin-top: 50px;
    padding: 30px;
    background: #111827;
    color: white;
    text-align: center;
}

@media(max-width:600px) {

    .logo {
        font-size: 19px;
    }

    .hero h1 {
        font-size: 27px;
    }

    .hero p {
        font-size: 14px;
    }

}

</style>

</head>

<body>

<header>

    <div class="logo">
        LISENZO TOP UP
    </div>

    <a href="admin/login.html"
       class="admin-btn">
        Admin
    </a>

</header>


<div class="notice">
    📢 eFootball Coin Top-Up — Fast & Secure Service
</div>


<section class="hero">

    <h1>
        ⚽ eFootball Coin Top-Up
    </h1>

    <p>
        Fast Delivery • Secure Payment • Trusted Service
    </p>

</section>


<h2 class="section-title">
    ⚽ eFootball Coins
</h2>


<div id="loading">
    Loading products...
</div>

<div id="error"></div>

<div class="products"
     id="products">
</div>


<footer>

    <h3>LISENZO TOP UP</h3>

    <p>
        eFootball Coin Top-Up Service
    </p>

    <p style="margin-top:10px;">
        © 2026 LISENZO TOP UP
    </p>

</footer>


<script>

// =====================================
// SUPABASE CONFIG
// =====================================

const SUPABASE_URL =
"https://spwhqftndqntkgqjczil.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_ZJYOQTotkhcF7Zlaeypx4w_L2gNHaya";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,,
    SUPABASE_PUBLISHABLE_KEY
);


// =====================================
// LOAD PRODUCTS
// =====================================

async function loadProducts() {

    const loading =
        document.getElementById("loading");

    const errorBox =
        document.getElementById("error");

    const productsBox =
        document.getElementById("products");


    const {
        data,
        error
    } = await supabaseClient
        .from("products")
        .select("*")
        .eq("Status", true)
        .order("id", {
            ascending: true
        });


    loading.style.display = "none";


    if (error) {

        console.error(error);

        errorBox.textContent =
            "Products load করতে সমস্যা হয়েছে: "
            + error.message;

        return;
    }


    if (!data || data.length === 0) {

        productsBox.innerHTML =
            "<p style='text-align:center;'>কোনো product পাওয়া যায়নি।</p>";

        return;
    }


    productsBox.innerHTML = "";


    data.forEach(product => {

        const card =
            document.createElement("div");

        card.className = "product";


        card.innerHTML = `

            <div class="coin">
                🪙
            </div>

            <h3>
                ${escapeHtml(product.Name)}
            </h3>

            <div class="description">
                ${escapeHtml(product.Description || "")}
            </div>

            <div class="price">
                ৳ ${product.Price}
            </div>

            <a
                href="order.html?product=${product.id}"
                class="buy-btn">

                BUY NOW

            </a>

        `;


        productsBox.appendChild(card);

    });
}


// =====================================
// SECURITY
// =====================================

function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


loadProducts();

</script>

</body>
</html>
