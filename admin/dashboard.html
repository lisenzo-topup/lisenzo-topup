<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LISENZO TOP UP - Admin Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f6f9;
    color: #172033;
}

header {
    background: #111827;
    color: white;
    padding: 18px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    color: #f39a00;
    font-size: 21px;
    font-weight: bold;
}

.logout {
    background: #ef4444;
    color: white;
    border: none;
    padding: 9px 15px;
    border-radius: 7px;
}

.container {
    width: 94%;
    max-width: 1100px;
    margin: 25px auto;
}

.box {
    background: white;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
    box-shadow: 0 3px 12px rgba(0,0,0,.07);
}

input {
    width: 100%;
    padding: 12px;
    margin: 7px 0 12px;
    border: 1px solid #ddd;
    border-radius: 7px;
}

.add-btn {
    width: 100%;
    background: #f39a00;
    color: white;
    border: none;
    padding: 12px;
    border-radius: 7px;
    font-weight: bold;
}

.product,
.order {
    border: 1px solid #eee;
    padding: 15px;
    border-radius: 10px;
    margin-top: 12px;
}

.price {
    color: #f39a00;
    font-size: 19px;
    font-weight: bold;
    margin: 8px 0;
}

.action-btn {
    border: none;
    padding: 8px 12px;
    border-radius: 6px;
    margin: 5px 5px 0 0;
    cursor: pointer;
}

.edit {
    background: #2563eb;
    color: white;
}

.delete {
    background: #ef4444;
    color: white;
}

.status {
    padding: 8px;
    border: 1px solid #ddd;
    border-radius: 6px;
    margin-top: 10px;
}

.order-id {
    color: #666;
    font-size: 13px;
}

.order-info {
    line-height: 1.7;
    margin-top: 8px;
}

.success {
    color: #16a34a;
}

.error {
    color: #dc2626;
}
</style>
</head>

<body>

<header>

    <div class="logo">
        LISENZO TOP UP
    </div>

    <button class="logout" onclick="logout()">
        Logout
    </button>

</header>


<div class="container">

    <!-- ADMIN INFO -->

    <div class="box">

        <h2>⚽ Admin Dashboard</h2>

        <p id="adminEmail">
            Checking login...
        </p>

    </div>


    <!-- ADD PRODUCT -->

    <div class="box">

        <h2>➕ Add Product</h2>

        <input
            type="text"
            id="productName"
            placeholder="Product name"
        >

        <input
            type="text"
            id="productDescription"
            placeholder="Description"
        >

        <input
            type="number"
            id="productPrice"
            placeholder="Price"
        >

        <button
            class="add-btn"
            onclick="addProduct()">

            ADD PRODUCT

        </button>

        <p id="message"></p>

    </div>


    <!-- PRODUCTS -->

    <div class="box">

        <h2>📦 Products</h2>

        <div id="products">
            Loading products...
        </div>

    </div>


    <!-- ORDERS -->

    <div class="box">

        <h2>🛒 Customer Orders</h2>

        <div id="orders">
            Loading orders...
        </div>

    </div>

</div>


<script>

// =====================================
// SUPABASE CONFIG
// =====================================

const SUPABASE_URL =
"https://spwhqftndqntkgqjczil.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_ZJYOQTotkhcF7Zlaeypx4w_L2gNHaya";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


// =====================================
// CHECK ADMIN
// =====================================

async function checkAdmin() {

    const {
        data: { user }
    } = await supabaseClient.auth.getUser();


    if (!user) {

        window.location.href = "login.html";

        return;
    }


    const { data: admin } =
        await supabaseClient
        .from("admins")
        .select("id")
        .eq("id", user.id)
        .maybeSingle();


    if (!admin) {

        await supabaseClient.auth.signOut();

        window.location.href = "login.html";

        return;
    }


    document.getElementById("adminEmail")
        .textContent =
        "Logged in as: " + user.email;


    loadProducts();
    loadOrders();
}


// =====================================
// LOAD PRODUCTS
// =====================================

async function loadProducts() {

    const {
        data,
        error
    } = await supabaseClient
        .from("products")
        .select("*")
        .order("id", {
            ascending: false
        });


    const container =
        document.getElementById("products");


    if (error) {

        container.innerHTML =
            "<p class='error'>Products load হয়নি.</p>";

        return;
    }


    if (!data || data.length === 0) {

        container.innerHTML =
            "<p>No products found.</p>";

        return;
    }


    container.innerHTML = "";


    data.forEach(product => {

        const div =
            document.createElement("div");

        div.className = "product";


        div.innerHTML = `

            <h3>
                ${escapeHtml(product.name)}
            </h3>

            <p>
                ${escapeHtml(product.description || "")}
            </p>

            <div class="price">
                ৳ ${product.price}
            </div>

            <p>
                Status:
                ${product.Status ? "🟢 Active" : "🔴 Inactive"}
            </p>

            <button
                class="action-btn edit"
                onclick="editProduct(
                    ${product.id},
                    '${escapeJs(product.name)}',
                    ${product.price}
                )">

                Edit

            </button>


            <button
                class="action-btn delete"
                onclick="deleteProduct(${product.id})">

                Delete

            </button>

        `;


        container.appendChild(div);

    });
}


// =====================================
// ADD PRODUCT
// =====================================

async function addProduct() {

    const name =
        document.getElementById("productName")
        .value.trim();


    const description =
        document.getElementById("productDescription")
        .value.trim();


    const price =
        Number(
            document.getElementById("productPrice")
            .value
        );


    if (!name || !price) {

        document.getElementById("message")
            .textContent =
            "Product name এবং price দিন.";

        return;
    }


    const { error } =
        await supabaseClient
        .from("products")
        .insert({

            name: name,

            description: description,

            price: price,

            "Status": true

        });


    if (error) {

        document.getElementById("message")
            .className = "error";

        document.getElementById("message")
            .textContent =
            error.message;

        return;
    }


    document.getElementById("message")
        .className = "success";

    document.getElementById("message")
        .textContent =
        "Product added successfully.";


    document.getElementById("productName")
        .value = "";

    document.getElementById("productDescription")
        .value = "";

    document.getElementById("productPrice")
        .value = "";


    loadProducts();
}


// =====================================
// EDIT PRODUCT
// =====================================

async function editProduct(
    id,
    oldName,
    oldPrice
) {

    const newName =
        prompt(
            "Product name:",
            oldName
        );


    if (newName === null) return;


    const newPrice =
        prompt(
            "Price:",
            oldPrice
        );


    if (newPrice === null) return;


    const { error } =
        await supabaseClient
        .from("products")
        .update({

            name: newName,

            price: Number(newPrice)

        })
        .eq("id", id);


    if (error) {

        alert(
            "Update failed: " +
            error.message
        );

        return;
    }


    loadProducts();
}


// =====================================
// DELETE PRODUCT
// =====================================

async function deleteProduct(id) {

    if (
        !confirm(
            "এই product delete করতে চান?"
        )
    ) {
        return;
    }


    const { error } =
        await supabaseClient
        .from("products")
        .delete()
        .eq("id", id);


    if (error) {

        alert(
            "Delete failed: " +
            error.message
        );

        return;
    }


    loadProducts();
}


// =====================================
// LOAD ORDERS
// =====================================

async function loadOrders() {

    const container =
        document.getElementById("orders");


    const {
        data,
        error
    } = await supabaseClient
        .from("orders")
        .select(`
            id,
            customer_name,
            customer_contact,
            player_id,
            payment_method,
            transaction_id,
            status,
            created_at,
            products (
                name,
                price
            )
        `)
        .order("id", {
            ascending: false
        });


    if (error) {

        container.innerHTML =
            "<p class='error'>Orders load হয়নি: "
            + escapeHtml(error.message)
            + "</p>";

        return;
    }


    if (!data || data.length === 0) {

        container.innerHTML =
            "<p>এখনো কোনো order নেই.</p>";

        return;
    }


    container.innerHTML = "";


    data.forEach(order => {

        const div =
            document.createElement("div");

        div.className = "order";


        const productName =
            order.products
            ? order.products.name
            : "Deleted Product";


        div.innerHTML = `

            <div class="order-id">
                Order #${order.id}
            </div>

            <h3>
                ${escapeHtml(productName)}
            </h3>

            <div class="order-info">

                <b>Customer:</b>
                ${escapeHtml(order.customer_name)}
                <br>

                <b>Contact:</b>
                ${escapeHtml(order.customer_contact)}
                <br>

                <b>Player ID:</b>
                ${escapeHtml(order.player_id)}
                <br>

                <b>Payment:</b>
                ${escapeHtml(order.payment_method)}
                <br>

                <b>Transaction ID:</b>
                ${escapeHtml(order.transaction_id)}
                <br>

                <b>Created:</b>
                ${new Date(order.created_at)
                    .toLocaleString()}

            </div>


            <select
                class="status"
                onchange="updateOrderStatus(
                    ${order.id},
                    this.value
                )">

                <option
                    value="Pending"
                    ${order.status === "Pending"
                        ? "selected"
                        : ""}>

                    Pending

                </option>

                <option
                    value="Completed"
                    ${order.status === "Completed"
                        ? "selected"
                        : ""}>

                    Completed

                </option>

                <option
                    value="Cancelled"
                    ${order.status === "Cancelled"
                        ? "selected"
                        : ""}>

                    Cancelled

                </option>

            </select>

        `;


        container.appendChild(div);

    });
}


// =====================================
// UPDATE ORDER STATUS
// =====================================

async function updateOrderStatus(
    orderId,
    newStatus
) {

    const { error } =
        await supabaseClient
        .from("orders")
        .update({
            status: newStatus
        })
        .eq("id", orderId);


    if (error) {

        alert(
            "Status update failed: " +
            error.message
        );

        return;
    }


    loadOrders();
}


// =====================================
// LOGOUT
// =====================================

async function logout() {

    await supabaseClient.auth.signOut();

    window.location.href =
        "login.html";
}


// =====================================
// ESCAPE HTML
// =====================================

function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


function escapeJs(value) {

    return String(value)
        .replaceAll("\\", "\\\\")
        .replaceAll("'", "\\'")
        .replaceAll("\n", "\\n")
        .replaceAll("\r", "\\r");
}


// START

checkAdmin();

</script>

</body>
</html>
