<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LISENZO TOP UP - Admin Login</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.10);
        }

        .logo {
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            color: #f39a00;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 16px;
        }

        button {
            width: 100%;
            border: none;
            background: #f39a00;
            color: white;
            padding: 13px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            color: #d00;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        LISENZO TOP UP
    </div>

    <div class="subtitle">
        Admin Panel Login
    </div>

    <form id="loginForm">

        <label>Email</label>

        <input
            type="email"
            id="email"
            placeholder="Admin Email"
            required
        >

        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            LOGIN
        </button>

    </form>

    <div id="message"></div>

</div>


<script>

const SUPABASE_URL = "https://spwhqftndqntkgqjczil.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_ZJYOQTotkhcF7Zlaeypx4w_L2gNHaya";


const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


document
.getElementById("loginForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");

    message.textContent = "Logging in...";


    const { data, error } =
        await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });


    if (error) {

        message.textContent =
            "Login failed: " + error.message;

        return;
    }


    const user = data.user;


    const { data: admin, error: adminError } =
        await supabaseClient
            .from("admins")
            .select("id")
            .eq("id", user.id)
            .maybeSingle();


    if (adminError || !admin) {

        await supabaseClient.auth.signOut();

        message.textContent =
            "এই account-এর Admin permission নেই.";

        return;
    }


    window.location.href = "dashboard.html";

});

</script>

</body>
</html>
